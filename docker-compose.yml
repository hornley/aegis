services:
  trueforge:
    image: node:22-alpine
    container_name: aegis-trueforge
    ports:
      - "8791:8791"
    environment:
      - TRUEFORGE_SANDBOX_IMAGE=ghcr.io/hornley/aegis/trueforge-sandbox-fixed:latest
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - trueforge-data:/home/node/.local/share/trueforge
    working_dir: /home/node
    command: >
      sh -c "
        npx -y @truefoundry/trueforge@latest --port 8791
      "
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8791/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  aegis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-app
    ports:
      - "7878:7878"
    environment:
      - HOST=0.0.0.0
      - PORT=7878
      - TRUEFORGE_BASE_URL=http://trueforge:8791
      - TRUEFORGE_MCP_URL=http://aegis:7878/mcp
      - TRUEFORGE_MODEL=ollama/qwen3-1.7b
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:1.7b
      - TRUEFORGE_MCP_SERVER_NAME=aegis-incident-lab
      - AEGIS_DEMO_DIR=./demo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      trueforge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  trueforge-data: