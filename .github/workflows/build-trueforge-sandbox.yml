name: Build TrueForge Sandbox Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile.trueforge-fixed'
      - '.github/workflows/build-trueforge-sandbox.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/trueforge-sandbox-fixed
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.trueforge-fixed
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URL
        run: |
          echo "Image pushed to: ghcr.io/${{ github.repository }}/trueforge-sandbox-fixed:latest"
          echo "Use this in TrueForge config:"
          echo "  TRUEFORGE_SANDBOX_IMAGE=ghcr.io/${{ github.repository }}/trueforge-sandbox-fixed:latest"